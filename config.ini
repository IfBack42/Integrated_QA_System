# 该文件用于: 管理整个项目的配置.

# MySQL 配置
[mysql]
host = localhost
# MYSQL_PASSWORD = .env
user = root
database = subjects_kg
# 权威FAQ数据表名保持稳定；数据版本由内容指纹单独管理。
faq_table_name = jpkb

# Redis 配置
[redis]
host = localhost
# REDIS_PASSWORD = .env
port = 6379
db = 0
# RAG生成但尚未审核的临时答案Key前缀；这类数据不进入正式FAQ索引。
temporary_answer_key_prefix = faq:interim:
# Redis Search正式FAQ搜索索引的名称。
faq_index_name = idx:faq:official
# 正式FAQ Hash文档的Key前缀，也是搜索索引Definition管理的数据范围。
faq_document_key_prefix = faq:official:
# Redis保存的权威FAQ内容版本；不放在正式文档前缀下，避免被当成FAQ文档。
faq_version_key = faq:meta:official:version

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = rag_system
collection_name = edurag_final


# LLM 配置
[llm]
model = qwen-plus
# DASHSCOPE_API_KEY = .env
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2
# Redis Search返回的原始BM25得分阈值，不是0到1的概率；后续通过测试集校准。
faq_bm25_threshold = 35.0

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone =
